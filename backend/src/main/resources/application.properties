spring.application.name=xyz-auto-service

# -------------------------------------------------------------
# Cloud Hosting & Reverse Proxy Support (Render, Railway, Fly.io, Netlify)
# -------------------------------------------------------------
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Default profile is intended for quick local demonstrations with embedded H2.
# Explicitly set SPRING_PROFILES_ACTIVE=postgres for PostgreSQL / Docker Compose.
spring.profiles.default=dev
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# Session & Cookie Cloud Configuration
# -------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.web.error.include-message=never

# -------------------------------------------------------------
# Web & HTTP Optimization (Gzip Compression & Keep-Alive)
# -------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

server.tomcat.keep-alive-timeout=15000
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=2000

# -------------------------------------------------------------
# Static Resources Caching (1 Hour HTTP Cache-Control)
# -------------------------------------------------------------
spring.web.resources.chain.cache=true
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true
