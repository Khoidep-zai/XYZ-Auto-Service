# Profile POSTGRES: Kết nối PostgreSQL thật (Local Docker Compose & Cloud Providers: Render, Railway, Neon, Supabase, Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/xyz_auto_service?sslmode=prefer}}}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# HikariCP Connection Pool Tuning (Production Grade - CDTN2)
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=20000
