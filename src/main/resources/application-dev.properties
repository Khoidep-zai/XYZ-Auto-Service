# Profile DEV: Chạy CSDL In-Memory chuẩn PostgreSQL
# Tự động khởi tạo schema và nạp 8 dịch vụ cùng 3 tài khoản mặc định (Manager, Staff, Customer)
spring.datasource.url=jdbc:h2:mem:xyz_auto_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

