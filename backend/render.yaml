services:
  # Backend API Web Service (Spring Boot 4 / Java 21)
  - type: web
    name: xyz-auto-service-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/csrf
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: xyz-auto-service-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:3000,http://localhost:8888"

databases:
  # Cloud PostgreSQL Managed Database
  - name: xyz-auto-service-db
    plan: free
    region: singapore
    databaseName: xyz_auto_service
    user: postgres
    ipAllowList: []
