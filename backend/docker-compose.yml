services:
  postgres:
    image: postgres:16-alpine
    container_name: xyz_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c max_connections=100
      -c synchronous_commit=off
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xyz_auto_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - xyz_postgres_data:/var/lib/postgresql/data
      - ./xyz_auto_service_postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - xyz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xyz_auto_service}"]
      interval: 3s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: xyz_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xyz_auto_service}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    networks:
      - xyz_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/csrf"]
      interval: 5s
      timeout: 3s
      start_period: 25s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M

volumes:
  xyz_postgres_data:
    name: xyz_auto_service_pgdata

networks:
  xyz_network:
    name: xyz_auto_service_network
    driver: bridge
