spring.application.name=xyz-auto-service

# Cấu hình CSDL PostgreSQL theo ràng buộc Đề bài Đồ án (PostgreSQL 14+)
# Khi chạy với PostgreSQL: tạo database xyz_auto_service và cấu hình tài khoản
# Để chuyển sang MySQL nếu muốn: đặt biến môi trường DB_URL='jdbc:mysql://localhost:3306/xyz_auto_service'
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xyz_auto_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.web.error.include-message=never
