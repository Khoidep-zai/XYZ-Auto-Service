spring.application.name=xyz-auto-service

# Profile mặc định: dev (Embedded H2 theo chuẩn cú pháp PostgreSQL)
# Giúp IntelliJ IDEA bấm 'Run' một phát là chạy ngay FE + BE + DB mà không bị lỗi kết nối DB.
# Khi cần chạy với PostgreSQL thật: kích hoạt profile 'postgres' hoặc cấu hình biến môi trường DB_URL.
spring.profiles.default=dev

# Cấu hình CSDL PostgreSQL thật (mặc định trỏ đến port 5433 của PostgreSQL 18 trên máy)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/xyz_auto_service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.web.error.include-message=never
